<!doctype html>
<!--
  LIBRARY PAGE TEMPLATE
  1. Copy this file to library/<category>.html
  2. Set data-category (twice) below to the card's `category` in src/data/cards.js
  3. Create src/js/specimens/<category>/index.js (copy one from another drawer)
  The header (title, code, description, prev/next) fills itself from the data.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MY Motion Maktaba</title>
    <meta name="theme-color" content="#a07a52" />

    <script>
      try { if (sessionStorage.getItem('mm:transition') !== null) document.documentElement.classList.add('is-arriving'); } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,0..100;1,9..144,300..600,0..100&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="../src/styles/main.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="importmap">
      {
        "imports": {
          "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/index.js",
          "gsap/ScrollTrigger": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/ScrollTrigger.js",
          "gsap/Flip": "https://cdn.jsdelivr.net/npm/gsap@3.15.1/Flip.js",
          "lenis": "https://cdn.jsdelivr.net/npm/lenis@1.3.28/dist/lenis.mjs"
        }
      }
    </script>
    <script type="module" src="../src/js/main.js"></script>
  </head>

  <body>
    <main>
      <header
        data-section="library-header"
        data-category="REPLACE-WITH-CATEGORY"
        class="library-header paper-kraft tear-edge--bottom tear-v1"
      ></header>

      <!-- CONTENT — the design lab. Its designs live in src/js/specimens/<category>/,
           listed in that folder's index.js (copy one from another drawer).
           With no designs yet it shows the "drawer empty" guide. -->
      <section class="library-content lab-wrap" data-section="specimen-lab" data-category="REPLACE-WITH-CATEGORY" aria-label="Designs"></section>
    </main>
  </body>
</html>
